<!DOCTYPE html>
<html lang="de" data-theme="ref">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dearVR Preset-Werkstatt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --panel:#f4f4f2; --line:#dcdcd8; --text:#1a1a1a; --muted:#595959;
  --card:#313131; --card2:#3b3b3b; --cardtext:#ffffff; --cardmuted:#b9b9b9; --brand:#fe9f4d;
  --accent:#fe9f4d; --accenttext:#1a1a1a; --input:#262626; --inputline:#4a4a4a; --diff:rgba(254,159,77,.28);
  --chip:#c6dcff; --chiptext:#305bab; --radius:12px;
}
:root[data-theme=dark]{
  --bg:#121212; --panel:#1b1b1b; --line:#2e2e2e; --text:#ececec; --muted:#9a9a9a;
  --card:#1e1e1e; --card2:#262626; --cardtext:#f1f1f1; --cardmuted:#9d9d9d; --brand:#50e8d8;
  --accent:#50e8d8; --accenttext:#062b2a; --input:#141414; --inputline:#3a3a3a; --diff:rgba(80,232,216,.22);
  --chip:#0b4f55; --chiptext:#50e8d8;
}
:root[data-theme=kawaii]{
  --bg:#fff4f9; --panel:#ffe6f1; --line:#ffc2dd; --text:#4a2b3d; --muted:#8b5f78;
  --card:#ffffff; --card2:#fff0f7; --cardtext:#4a2b3d; --cardmuted:#8b5f78; --brand:#d05aa0;
  --accent:#ff7eb6; --accenttext:#ffffff; --input:#ffffff; --inputline:#ffb3d4; --diff:rgba(255,126,182,.25);
  --chip:#e9dcff; --chiptext:#7a4fd0; --radius:20px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Noto Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:12.5px;line-height:1.35}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

/* Kopf */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
header.top h1{margin:0;font-size:16px;font-weight:700;margin-right:6px}
header.top .ver{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);margin-right:10px}
.btn{border:1px solid var(--line);background:var(--panel);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accenttext);border-color:var(--accent)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:default}
.sp{flex:1}
.menu{position:relative}
.menu .pop{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:260px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:6px;z-index:30}
.menu.open .pop{display:block}
.pop button.it{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;font-size:13px}
.pop button.it:hover{background:var(--panel)}
.pop button.it small{display:block;color:var(--muted);font-size:11.5px}
.pop label.it{display:flex;gap:8px;align-items:center;padding:8px 10px;font-size:13px}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* Layout */
.wrap.noside{grid-template-columns:minmax(0,1fr)}.wrap.noside aside{display:none}
.wrap{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 56px)}
aside{border-right:1px solid var(--line);background:var(--panel);padding:14px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto}
main{padding:20px;min-width:0}
aside h2{margin:0 0 8px;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-family:'IBM Plex Mono',monospace}
aside input.q{width:100%;padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);margin-bottom:8px}
.sel-row{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.pi{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:8px;border:1px solid transparent}
.pi:hover{background:var(--bg)}
.pi.f{background:var(--bg);border-color:var(--accent)}
.pi .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.pi input.rn{flex:1;min-width:0;padding:2px 6px;border:1px solid var(--accent);border-radius:6px;background:var(--bg)}
.pi button{background:none;border:0;padding:2px 5px;border-radius:6px;opacity:.55;font-size:14px}
.pi button:hover{opacity:1;background:var(--line)}
.bd{font-family:'IBM Plex Mono',monospace;font-size:10px;padding:1px 6px;border-radius:999px;background:var(--chip);color:var(--chiptext);white-space:nowrap}
.bd.v1{background:#ffe2b8;color:#8a4b00}
.bd.werk{background:#d9d9d9;color:#333}
.sec-toggles{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.sec-toggles label{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--bg);cursor:pointer;user-select:none}
.sec-toggles input{margin-right:4px}

/* Leerzustand */
.empty{border:2px dashed var(--line);border-radius:var(--radius);padding:50px 24px;text-align:center;color:var(--muted)}
.empty h2{color:var(--text);margin:0 0 6px}
.drop-on .empty,.drop-on main{outline:3px dashed var(--accent);outline-offset:-8px}

/* Karten */
.card{background:var(--card);color:var(--cardtext);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;border:1px solid transparent}
:root[data-theme=kawaii] .card{border-color:var(--line);box-shadow:0 6px 0 var(--line)}
.card .brand{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:1px;color:var(--brand)}
.card h3{margin:2px 0 4px;font-size:17px}
.card .chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--chiptext)}
.card-body{display:flex;gap:18px;align-items:flex-start}
.tbl-wrap{flex:1;min-width:0;overflow:auto;max-height:640px;border-radius:8px}
.pv{flex:0 0 var(--pvw,420px);position:sticky;top:70px}
.pv svg{width:100%;height:auto;display:block;border-radius:10px;background:#1f1f1f;touch-action:none}
.pv .cap{font-size:12px;color:var(--cardmuted);margin-top:6px}
.pv.full{flex:1}
.pv.off{display:none}
table.t{border-collapse:separate;border-spacing:0;font-size:12px;width:max-content}
table.t th,table.t td{padding:2px 4px;border-bottom:1px solid var(--card2);vertical-align:middle}
table.t thead th{position:sticky;top:0;background:var(--card);z-index:3;text-align:left;vertical-align:top;padding-bottom:8px}
table.t th.rowh,table.t td.rowh{position:sticky;left:0;background:var(--card);z-index:2;min-width:150px;max-width:190px}
table.t thead th.rowh{z-index:4}
.rowh .lab{font-weight:600}
.rowh .key{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--cardmuted)}
.rowh .sp2{float:right}
.rowh button.spread{background:none;border:1px solid var(--inputline);border-radius:6px;font-size:11px;padding:0 5px;color:var(--cardmuted)}
.rowh button.spread:hover{border-color:var(--accent);color:var(--accent)}
th.pc{width:92px;min-width:92px;max-width:110px}
.rowh .lab{font-size:11.5px}.rowh .key{font-size:9.5px!important}
th.pc input.nm{font-size:11px;padding:2px 4px!important}
th.pc input.nm{width:100%;background:var(--input);border:1px solid var(--inputline);border-radius:6px;padding:3px 6px;font-weight:700;color:var(--cardtext)}
th.pc.focus input.nm{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
th.pc .acts{display:flex;gap:4px;margin-top:4px;align-items:center}
th.pc .acts button{background:none;border:1px solid var(--inputline);border-radius:6px;font-size:12px;padding:0 6px;color:var(--cardmuted)}
th.pc .acts button:hover{border-color:var(--accent);color:var(--accent)}
th.pc .acts button.on{background:var(--accent);color:var(--accenttext);border-color:var(--accent)}
td input.cell,td select.cell{width:100%;background:var(--input);border:1px solid var(--inputline);border-radius:6px;padding:2px 5px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--cardtext)}
td input.cell:focus,td select.cell:focus{outline:2px solid var(--accent);outline-offset:-1px}
td.diff input.cell,td.diff select.cell{background:var(--diff)}
td.chk{text-align:center}
td.chk input{width:18px;height:18px;accent-color:var(--accent)}
td.diff.chk{background:var(--diff)}
.note{font-size:12px;color:var(--cardmuted);margin-top:8px}
.pnotes{margin:0 0 16px;padding:10px 14px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.pnotes b{color:var(--text)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.35);display:none}
.toast.on{display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:#fe9f4d;font-weight:700}
@media (max-width:1100px){.wrap{grid-template-columns:1fr}aside{position:static;height:auto}.card-body{flex-direction:column}.pv{position:static;flex:none;width:100%}}
</style>
</head>
<body>
<header class="top">
  <button class="btn" id="bSide" title="Preset-Liste ein-/ausklappen">☰ Liste</button>
  <h1>dearVR Preset-Werkstatt</h1><span class="ver">v1.9.0</span>
  <div class="menu" id="mLoad"><button class="btn pri" data-menu="mLoad">Presets laden ▾</button>
    <div class="pop">
      <button class="it" id="bFiles">Dateien wählen…<small>Reaper .ini, .vstpreset, .aupreset, .csv, .xlsx (mehrere möglich)</small></button>
      <button class="it" id="bFolder">Ordner wählen…<small>liest alle Presets darin, auch aus Unterordnern</small></button>
      <button class="it" id="bFactory">Werkspresets dearVR PRO 2<small>die 47 mitgelieferten Presets</small></button>
      <button class="it" id="bNew">Neues Preset (Standardwerte)</button>
      <hr><div style="padding:6px 10px;font-size:12px;color:var(--muted)">Oder Dateien einfach ins Fenster ziehen.</div>
    </div>
  </div>
  <div class="menu" id="mExp"><button class="btn" data-menu="mExp">Exportieren ▾</button>
    <div class="pop">
      <div style="padding:6px 10px 2px;font-size:11px;letter-spacing:1px;color:var(--muted)" class="mono">ZIELFORMAT PLUGIN-PRESETS</div>
      <label class="it"><input type="radio" name="tgt" value="pro2" checked> dearVR PRO 2</label>
      <label class="it"><input type="radio" name="tgt" value="pro1"> dearVR PRO (v1, Plugin Alliance)</label>
      <label class="it" style="opacity:.45"><input type="radio" name="tgt" value="iem" disabled> IEM RoomEncoder (nächster Schritt)</label>
      <hr>
      <button class="it" data-exp="xlsx">Tabelle als Excel (.xlsx)<small>alle gehakten Presets, eine Zeile pro Preset</small></button>
      <button class="it" data-exp="csv">Tabelle als CSV<small>UTF-8, Semikolon, für Excel/Numbers</small></button>
      <label class="it"><input type="checkbox" id="optComma" checked> CSV mit Dezimalkomma (deutsches Excel)</label>
      <hr>
      <div style="padding:6px 10px 2px;font-size:11px;letter-spacing:1px;color:var(--muted)" class="mono">DATEITYPEN</div>
      <label class="it"><input type="checkbox" class="fmt" value="vst3" checked> VST3 (.vstpreset) – Nuendo, Reaper, Cubase</label>
      <label class="it"><input type="checkbox" class="fmt" value="fxp"> VST2 (.fxp) – nur dearVR PRO v1, Reaper</label>
      <label class="it"><input type="checkbox" class="fmt" value="au"> AU (.aupreset) – Logic</label>
      <button class="it" data-exp="plug"><b>Plugin-Presets exportieren</b><small>ein Preset + ein Typ = einzelne Datei, sonst ZIP</small></button>
    </div>
  </div>
  <div class="menu" id="mPar"><button class="btn" data-menu="mPar" id="bPar">Parameter ▾</button><div class="pop" id="parPop" style="max-height:70vh;overflow:auto;min-width:280px"></div></div>
  <div class="menu" id="mTpl"><button class="btn" data-menu="mTpl">Vorlage ▾</button>
    <div class="pop">
      <button class="it" data-exp="tplx">Vorlage Excel (.xlsx)<small>zum Ausfüllen ohne Browser-Oberfläche, mit Hilfeblatt</small></button>
      <button class="it" data-exp="tplc">Vorlage CSV</button>
    </div>
  </div>
  <button class="btn" id="bUndo" disabled>↶ Rückgängig</button>
  <div class="menu" id="mHist"><button class="btn" data-menu="mHist" id="bHist">Verlauf ▾</button><div class="pop" id="histPop" style="max-height:60vh;overflow:auto;min-width:300px"></div></div>
  <label class="btn" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="optDiff"> Unterschiede markieren</label>
  <select class="btn" id="editMode" title="Worauf wirken Regler im Plugin-Bild und Eingaben in der Tabelle?">
    <option value="focus">Änderungen wirken auf: nur dieses Preset</option>
    <option value="abs">Änderungen wirken auf: alle gezeigten (gleicher Wert)</option>
    <option value="rel">Änderungen wirken auf: alle gezeigten (relativ)</option>
  </select>
  <label class="btn" style="display:flex;gap:6px;align-items:center" title="Statt Plugin-Einheiten die Rohwerte 0–1 aus der Datei zeigen"><input type="checkbox" id="optRaw"> Rohwerte</label>
  <span class="sp"></span>
  <select class="btn" id="uiz" title="Gesamtgröße der Oberfläche"><option value="0.85">Schrift S</option><option value="1">Schrift M</option><option value="1.15">Schrift L</option></select>
  <select class="btn" id="theme" title="Darstellung">
    <option value="ref">Referenz</option><option value="dark">Dunkel</option><option value="kawaii">Kawaii</option>
  </select>
</header>
<div class="wrap" id="wrap">
  <aside>
    <h2>Presets</h2>
    <input class="q" id="q" placeholder="Suchen…">
    <div class="sel-row"><button class="btn sm" id="selAll">Alle</button><button class="btn sm" id="selNone">Keine</button><button class="btn sm" id="selFiltered">Nur Treffer</button><button class="btn sm" id="clearAll" title="Alle Presets aus der Werkstatt entfernen (Dateien bleiben unberührt)">Alle entfernen</button></div>
    <div id="plist"></div>
    <div class="sec-toggles" id="secT"></div>
  </aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastUndo">Rückgängig</button></div>
<input type="file" id="fileIn" multiple hidden accept=".ini,.vstpreset,.aupreset,.csv,.xlsx,.txt">
<input type="file" id="dirIn" webkitdirectory multiple hidden>

<script>
'use strict';
/* ===================================================================
   Daten: Werkspresets dearVR PRO 2 (aus /Library/Audio/Presets/Dear Reality)
   =================================================================== */
const FACTORY = __FACTORY_JSON__;

/* ===================================================================
   Parameter-Definition (Reihenfolge exakt wie im Plugin-State)
   =================================================================== */
const ORDER = ["OutputMode","CoordinateSystem","Azimuth","Elevation","Distance","X","Y","Z","DirectGain","AzimuthScale","DistanceScale","Occlusion","VirtualAcoustics","RoomSize","ReverbON","ReverbGain","ReverbLowPass","ReverbHighPass","ReflectionON","ReflectionGain","ReflectionLowPass","ReflectionHighPass","RealTimeAuralization","TopWall","BottomWall","FrontWall","BackWall","LeftWall","RightWall","Bypass","BassBoost","PerformanceMode","StereoWidth","MasterGain","LfeGain","Clarity","xyPadView","xyPadZoom"];
const RENAME = {Polar:"CoordinateSystem", ReverbDamping:"ReverbLowPass", ReflectionDamping:"ReflectionLowPass"};
const DEF_NEW = {OutputMode:"0.02400000020861626",CoordinateSystem:"0",AzimuthScale:"0.23076921701431274414",DistanceScale:"0.099099099636077880859",
  ReverbLowPass:"1",ReverbHighPass:"0",ReflectionLowPass:"1",ReflectionHighPass:"0",StereoWidth:"0.3333333432674407959",LfeGain:"0",Clarity:"0",xyPadView:"0",xyPadZoom:"2"};

// type: n = 0..1 | b = 0/1 | z = Zoom 0..4 | r = Raum-Auswahl | o = OutputMode (frei)
const P = {
  CoordinateSystem:{l:"Koordinaten-Umschalter",t:"b",h:"0 = Kartesisch-/Polar-Ansicht links, 1 = rechts"},
  Azimuth:{l:"Azimut",t:"n",h:"0–1, 0.5 = Mitte"},
  Elevation:{l:"Elevation",t:"n",h:"0–1, 0.5 = Mitte"},
  Distance:{l:"Distanz (Radius)",t:"n"},
  X:{l:"Position X",t:"n"}, Y:{l:"Position Y",t:"n"}, Z:{l:"Position Z",t:"n"},
  DirectGain:{l:"Direktsignal-Gain",t:"n"},
  AzimuthScale:{l:"Azimut-Skalierung",t:"n"},
  DistanceScale:{l:"Distanz-Skalierung",t:"n"},
  Occlusion:{l:"Occlusion (Verdeckung)",t:"n"},
  Clarity:{l:"Clarity",t:"n"},
  xyPadView:{l:"XY-Pad Ansicht",t:"b",h:"0 oder 1"},
  xyPadZoom:{l:"XY-Pad Zoom",t:"z",h:"0–4"},
  VirtualAcoustics:{l:"Raum-Preset (Virtual Acoustics)",t:"r"},
  RoomSize:{l:"Raumgröße (Size)",t:"n",h:"1 = 100 %"},
  ReverbON:{l:"Reverb an",t:"b"},
  ReverbGain:{l:"Reverb-Gain",t:"n"},
  ReverbLowPass:{l:"Reverb-Damping (Tiefpass)",t:"n"},
  ReverbHighPass:{l:"Reverb-Hochpass",t:"n",h:"nur PRO 2"},
  ReflectionON:{l:"Reflections an",t:"b"},
  RealTimeAuralization:{l:"Realtime Auralisation",t:"b"},
  ReflectionGain:{l:"Reflections-Gain",t:"n"},
  ReflectionLowPass:{l:"Reflections-Damping (Tiefpass)",t:"n"},
  ReflectionHighPass:{l:"Reflections-Hochpass",t:"n",h:"nur PRO 2"},
  LeftWall:{l:"Wand links",t:"n"}, FrontWall:{l:"Wand vorn",t:"n"}, RightWall:{l:"Wand rechts",t:"n"},
  TopWall:{l:"Wand oben (Decke)",t:"n"}, BackWall:{l:"Wand hinten",t:"n"}, BottomWall:{l:"Wand unten (Boden)",t:"n"},
  OutputMode:{l:"Ausgabeformat (OutputMode)",t:"o",h:"Dateiwert; 0.024 = Binaural. Über „⇉“ für alle setzen."},
  MasterGain:{l:"Master-Gain",t:"n"},
  LfeGain:{l:"LFE-Gain",t:"n"},
  StereoWidth:{l:"Stereo-Breite",t:"n",h:"nur PRO 2"},
  Bypass:{l:"Bypass",t:"b"}, BassBoost:{l:"Bass Boost",t:"b"}, PerformanceMode:{l:"Performance Mode",t:"b"}
};
const SECTIONS = [
  {id:"pos", en:"POSITION",    de:"Position & Quelle",  vb:[71,75,654,660],
   keys:["CoordinateSystem","Azimuth","Elevation","Distance","X","Y","Z","xyPadView","xyPadZoom","DirectGain","AzimuthScale","DistanceScale","Occlusion","Clarity"]},
  {id:"rev", en:"REVERB",      de:"Reverb & Raum",       vb:[738,75,615,285],
   keys:["VirtualAcoustics","RoomSize","ReverbON","ReverbGain","ReverbLowPass","ReverbHighPass"]},
  {id:"ref", en:"REFLECTIONS", de:"Reflexionen & Wände", vb:[738,367,615,369],
   keys:["ReflectionON","RealTimeAuralization","ReflectionGain","ReflectionLowPass","ReflectionHighPass","LeftWall","FrontWall","RightWall","TopWall","BackWall","BottomWall"]},
  {id:"out", en:"MASTER",      de:"Master & Ausgabe",    vb:[1364,75,219,660],
   keys:["OutputMode","MasterGain","LfeGain","StereoWidth","Bypass","BassBoost","PerformanceMode"]}
];
const SEC_HINT = {id:"hint"};

/* Werkspresets entpacken */
const FACT = {};   // name -> params
FACTORY.names.forEach((n,i)=>{ const o={}; ORDER.forEach((k,j)=>o[k]=FACTORY.vals[i][j]); FACT[n]=o; });
const DEFAULT_PARAMS = FACT["Default"] || Object.fromEntries(ORDER.map(k=>[k,DEF_NEW[k]||"0"]));

/* Raum-Auswahl: Wert → Name (aus den Werkspresets; die zwei ersten Plätze sind aus dem Muster 0.004 + 0.01·i abgeleitet) */
const ROOMS = [{v:0.004,n:"Direct Signal (abgeleitet)"},{v:0.014,n:"Reflections Only (abgeleitet)"}];
FACTORY.names.forEach(n=>{ if(n!=="Default") ROOMS.push({v:parseFloat(FACT[n].VirtualAcoustics), n}); });
ROOMS.sort((a,b)=>a.v-b.v);
function roomName(v){ const x=parseFloat(v); const r=ROOMS.find(r=>Math.abs(r.v-x)<0.0006); return r?r.n:null; }
function roomByName(n){ n=String(n).toLowerCase().replace(/[*]|\(abgeleitet\)/g,"").trim(); const r=ROOMS.find(r=>r.n.toLowerCase().replace(" (abgeleitet)","")===n); return r?r.v:null; }
/* Ausgabeformat: bekannte Dateiwerte */
const OUT_LBL=[{v:0.02,n:"Binaural (2CH) · v1-Wert"},{v:0.024,n:"Binaural (2CH)"},{v:0.064,n:"TOA ambiX (16CH) · v1-Wert"}];
function outLabel(v){ const r=OUT_LBL.find(r=>Math.abs(r.v-num(v))<1e-6); return r?r.n:null; }

/* ===================================================================
   Umrechnung Dateiwert (0–1) ↔ Plugin-Anzeige
   bestätigt an „Cantina_Küche“ (Plugin-Screenshot) und den Werkspresets
   =================================================================== */
const f1=d=>d.toFixed(1), f2d=d=>d.toFixed(2);
const DB  ={toD:v=>v<=0.0005?-Infinity:(v-.8)*120, fromD:d=>(d===-Infinity||d<=-95.9)?0:.8+d/120, fmt:d=>d===-Infinity?"-inf":f1(d), u:"dB", rng:"−inf … +24 dB"};
const POS ={toD:v=>(v-.5)*60, fromD:d=>.5+d/60, fmt:f2d, u:"m", rng:"−30 … +30 m"};

function parseState(bytes){
  const i=findBytes(bytes,utf8("VC2!")); if(i<0) throw new Error("kein JUCE-State (VC2!) gefunden");

  const m=xml.match(/<DEARVRPLUGINSTATE\s([\s\S]*?)\/>/); if(!m) throw new Error("kein DEARVRPLUGINSTATE");
  const out=[]; const re=/(\w+)="([^"]*)"/g; let r; while((r=re.exec(m[1]))) out.push([r[1],r[2]]); return out;
}
function convert(attrs){
  const notes=[], extra={}; const src=Object.fromEntries(attrs);
  const isV1=("Polar" in src)||("ReverbDamping" in src)||("ReflectionDamping" in src);
  const v2={};
  for(const [k,v] of attrs){
    if(k==="InputChannel"){ extra.InputChannel=v; if(num(v)!==0) notes.push("InputChannel="+fmt(v)+" gibt es in PRO 2 nicht (bleibt für v1-Export erhalten)"); continue; }
    if(k==="VRLinkTrackName"){ extra.VRLinkTrackName=v; continue; }
    v2[RENAME[k]||k]=v;
  }
  ORDER.forEach(k=>{ if(!(k in v2)) v2[k]=(k in DEF_NEW)?DEF_NEW[k]:DEFAULT_PARAMS[k]; });
  if(isV1){
    if(Math.abs(num(v2.AzimuthScale)-0.22556391358375549)<1e-6) v2.AzimuthScale=DEF_NEW.AzimuthScale;
    if(Math.abs(num(v2.OutputMode)-0.02)<1e-6) v2.OutputMode=DEF_NEW.OutputMode;
    else notes.push("Ausgabeformat "+(outLabel(v2.OutputMode)||fmt(v2.OutputMode))+": Dateiwert aus v1 übernommen – in PRO 2 prüfen");

}
function addFromAttrs(name,attrs,srcLabel){
  const c=convert(attrs);

}
function parseIni(text){
  const secs={}; let cur=null;
  text.split(/\r?\n/).forEach(l=>{ const m=l.match(/^\[(.+)\]\s*$/); if(m){cur=secs[m[1]]={};return;} const e=l.indexOf("="); if(cur&&e>0) cur[l.slice(0,e)]=l.slice(e+1).trim(); });
  const out=[];
  Object.keys(secs).filter(k=>/^Preset\d+$/.test(k)).sort((a,b)=>num(a.slice(6))-num(b.slice(6))).forEach(k=>{
    const s=secs[k]; let hex=s.Data||""; Object.keys(s).filter(x=>/^Data_\d+$/.test(x)).sort((a,b)=>num(a.slice(5))-num(b.slice(5))).forEach(x=>hex+=s[x]);
    hex=hex.replace(/\s+/g,""); const u=new Uint8Array(hex.length/2); for(let i=0;i<u.length;i++) u[i]=parseInt(hex.substr(i*2,2),16);
    out.push({name:s.Name||k,bytes:u});

}

}
function parseCSV(text){
  text=text.replace(/^﻿/,""); const first=text.split(/\r?\n/)[0]||""; const delim=(first.split(";").length>=first.split(",").length)?";":",";

    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++} else q=false } else cell+=c; }
    else if(c==='"') q=true; else if(c===delim){row.push(cell);cell=""} else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell=""} else if(c!=="\r") cell+=c; }

function importTable(rows,srcLabel){
  const hi=rows.findIndex(r=>r.length&&/^(name|preset)$/i.test((r[0]||"").trim())); if(hi<0) throw new Error("Kopfzeile mit „Name“ nicht gefunden");
  const head=rows[hi].map(h=>(h||"").trim()); const idx={}, didx={};
  head.forEach((h,i)=>{ const m=h.match(/^([A-Za-z]+)(#raw)?\s*(\[.*\])?$/); if(!m) return; const k=ORDER.concat(Object.keys(RENAME),["InputChannel","VRLinkTrackName"]).find(o=>o.toLowerCase()===m[1].toLowerCase()); if(!k) return;
    if(m[2]){ idx[k]=i; return; } if(m[3]||P[k]&&(P[k].t==="r"||P[k].t==="o")) didx[k]=i; else idx[k]=i; });
  let n=0;
  for(let r=hi+1;r<rows.length;r++){ const row=rows[r]; const nm=(row[0]||"").trim(); if(!nm||nm[0]==="#") continue;
    const attrs=[]; const notes=[];
    Object.keys(idx).forEach(k=>{ let v=(row[idx[k]]||"").toString().trim(); if(v==="") return; if(k==="VRLinkTrackName"){ attrs.push([k,v]); return; } v=v.replace(",","."); if(isNaN(parseFloat(v))){ notes.push(k+": „"+v+"“ ist keine Zahl (Standard genommen)"); return; } attrs.push([k,v]); });
    const missing=ORDER.filter(k=>!(k in idx)&&!(k in didx)&&!Object.keys(RENAME).some(o=>RENAME[o]===k&&o in idx));
    const c=convert(attrs); c.notes.push(...notes); if(missing.length&&missing.length<ORDER.length) c.notes.push(missing.length+" Parameter fehlten in der Tabelle (Standardwerte)");

    Object.keys(didx).filter(k=>!(U[k]&&U[k].polar)).sort((a,b)=>(["X","Y","Z"].includes(a)?0:1)-(["X","Y","Z"].includes(b)?0:1)).forEach(k=>{
      const v=(row[didx[k]]||"").toString().trim(); if(v==="") return;
      if(P[k].t==="r"){ const r=roomByName(v); if(r!=null) put({[k]:r}); else if(!isNaN(parseFloat(v))) put({[k]:parseFloat(v.replace(",","."))}); else c.notes.push("Raum „"+v+"“ unbekannt"); return; }
      if(P[k].t==="o"){ const r=OUT_LBL.find(o=>o.n.toLowerCase()===v.toLowerCase()); if(r) put({[k]:r.v}); else if(!isNaN(parseFloat(v.replace(",",".")))) put({[k]:parseFloat(v.replace(",","."))}); return; }
      const d=parseDisp(v); if(d==null){ c.notes.push(k+": „"+v+"“ ist keine Zahl"); return; } put(rawFromDisp(tmp,k,d)); });
    ["Azimuth","Elevation","Distance"].forEach(k=>{ if(k in idx){ const v=(row[idx[k]]||"").toString().trim().replace(",","."); if(v!==""&&!isNaN(parseFloat(v))) tmp.params[k]=v; } });
    ["Azimuth","Elevation","Distance"].forEach(k=>{ if(k in didx){ const d=parseDisp(row[didx[k]]||""); if(d!=null) pol[U[k].polar]=d; } });
    if(Object.keys(pol).length){ const cur=polarOf(tmp); const ch=Object.keys(pol).some(a=>Math.abs(pol[a]-cur[a])>(a==="d"?0.02:0.6)); if(ch) put(polarRaw({...cur,...pol})); }

}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

  const parts=[],cd=[]; let off=0;
  files.forEach(f=>{ const nm=utf8(f.name),d=f.data,crc=crc32(d);
    const lh=concat(u32le(0x04034b50),new Uint8Array([20,0,0,8,0,0,0,0,0x21,0]),u32le(crc),u32le(d.length),u32le(d.length),new Uint8Array([nm.length&255,nm.length>>8,0,0]),nm);
    parts.push(lh,d);
    cd.push(concat(u32le(0x02014b50),new Uint8Array([20,0,20,0,0,8,0,0,0,0,0x21,0]),u32le(crc),u32le(d.length),u32le(d.length),new Uint8Array([nm.length&255,nm.length>>8,0,0,0,0,0,0,0,0]),u32le(0),u32le(off),nm));
    off+=lh.length+d.length; });
  const cds=concat(...cd);
  return concat(...parts,cds,u32le(0x06054b50),new Uint8Array([0,0,0,0,files.length&255,files.length>>8,files.length&255,files.length>>8]),u32le(cds.length),u32le(off),new Uint8Array([0,0]));
}
async function inflateRaw(u8){ const s=new Blob([u8]).stream().pipeThrough(new DecompressionStream("deflate-raw")); return new Uint8Array(await new Response(s).arrayBuffer()); }

  const u=new Uint8Array(buf),dv=new DataView(buf); let e=u.length-22; while(e>=0&&dv.getUint32(e,true)!==0x06054b50) e--; if(e<0) throw new Error("kein ZIP");
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const out={};
  for(let i=0;i<n;i++){ const method=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),el=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u.subarray(p+46,p+46+nl)); const ln=dv.getUint16(lo+26,true),le=dv.getUint16(lo+28,true); const raw=u.subarray(lo+30+ln+le,lo+30+ln+le+csz);
    out[name]=method===0?raw:await inflateRaw(raw); p+=46+nl+el+cl; }

/* --- Dateien importieren --- */
async function importFiles(files){
  files=[...files]; let added=0; const errs=[]; pushHist("Import");
  for(const f of files){
    const ext=(f.name.split(".").pop()||"").toLowerCase(); const base=f.name.replace(/\.[^.]+$/,"");
    try{
      if(ext==="ini"){ const list=parseIni(await f.text()); list.forEach(p=>{ try{ addFromAttrs(p.name,parseState(p.bytes)); added++; }catch(e){ errs.push(f.name+" / "+p.name+": "+e.message); } }); }
      else if(ext==="vstpreset"){ addFromAttrs(base,parseState(new Uint8Array(await f.arrayBuffer()))); added++; }
      else if(ext==="aupreset"){ const a=parseAupreset(await f.text()); addFromAttrs(a.name||base,parseState(a.bytes)); added++; }
      else if(ext==="csv"||ext==="txt"){ added+=importTable(parseCSV(await f.text()),"Tabelle"); }
      else if(ext==="xlsx"){ added+=importTable(await readXlsxRows(await f.arrayBuffer()),"Tabelle"); }
    }catch(e){ errs.push(f.name+": "+e.message); }
  }
  if(!S.focus&&S.presets.length) S.focus=S.presets[0].id;
  if(!added){ hist.pop(); $("#bUndo").disabled=!hist.length; renderHist(); }
  renderAll(); save();
  toast(added+" Preset(s) geladen"+(errs.length?" – "+errs.length+" Problem(e): "+errs[0]:""),added>0);
}
async function entriesToFiles(entries,plain){
  const out=[...plain]; async function walk(en){ if(en.isFile){ await new Promise(r=>en.file(f=>{out.push(f);r()},r)); } else if(en.isDirectory){ const rd=en.createReader(); let b; do{ b=await new Promise(r=>rd.readEntries(r,()=>r([]))); for(const c of b) await walk(c); }while(b.length); } }
  for(const en of entries) if(en) await walk(en);
  return plain.length&&!entries.some(Boolean)?plain:(entries.some(Boolean)?out.slice(plain.length):out);
}

let editPushed=false;
function applyRaw(p,obj){ let ch=false;
  for(const k in obj){ const t=P[k].t; let n=num(obj[k]); if(t==="b") n=n>=.5?1:0; else if(t==="z") n=clamp(Math.round(n),0,4); else if(t==="n") n=clamp(n,0,1);
    const s=(t==="b"||t==="z")?String(n):(Math.abs(n-num(p.params[k]))<1e-12?p.params[k]:String(Number(n.toFixed(9))));
    if(s!==p.params[k]){ p.params[k]=s; ch=true; } }
  if(ch) refreshCells(p); return ch; }
function refreshCells(p){ $$('#main [data-id="'+p.id+'"][data-k]').forEach(el=>{ const k=el.dataset.k;
  if(el.type==="checkbox") el.checked=num(p.params[k])>=.5;
  else if(el.tagName==="SELECT"){ if(P[k].t==="z") el.value=String(Math.round(num(p.params[k]))); else el.outerHTML=selectHtml(p,k); }
  else if(document.activeElement!==el){ el.value=cellVal(p,k); el.title="Dateiwert "+p.params[k]; } }); }
function setParam(id,k,val){ const p=byId(id); if(!p) return; if(applyRaw(p,{[k]:val})){ if(p.id===S.focus) refreshSvgs(); updateDiff(); save(); } }
/* Tabelleneingabe – wirkt je nach „Regler wirken auf“ auch auf alle gezeigten Presets */
function cellEdit(p,k,t){ if(!p) return; const mode=S.edit||"focus";
  const tg=mode==="focus"?[p]:[p,...visiblePresets().filter(x=>x.id!==p.id)];
  const disp=t.matches("input.cell")&&!S.raw&&U[k];
  if(t.type==="checkbox"||t.tagName==="SELECT"||(mode!=="rel")){
    const val=t.type==="checkbox"?(t.checked?1:0):t.value;

  } else {
    if(disp){ const d=parseDisp(t.value); if(d==null){ refreshCells(p); toast("„"+t.value+"“ ist keine Zahl"); return; }
      const old=dispOf(p,k), delta=(d===-Infinity||old===-Infinity)?null:d-old;
      tg.forEach(x=>{ if(delta==null){ if(x===p) applyRaw(x,rawFromDisp(x,k,d)); return; } const o=dispOf(x,k); applyRaw(x,rawFromDisp(x,k,(o===-Infinity?(U[k].fromD?-96:0):o)+delta)); }); }
    else { const delta=num(t.value)-num(p.params[k]); tg.forEach(x=>applyRaw(x,{[k]:num(x.params[k])+delta})); }
  }
  refreshCells(p); refreshSvgs(); updateDiff(); save();
  if(tg.length>1) toast("„"+P[k].l+"“ auf "+tg.length+" Presets angewendet ("+(mode==="rel"&&t.type!=="checkbox"&&t.tagName!=="SELECT"?"relativ":"gleicher Wert")+")",true); }

/* --- Ziehen im Plugin-Bild --- */
let drag=null;
document.addEventListener("pointerdown",e=>{
  const el=e.target.closest("#main [data-ctl]"); if(!el) return; const svg=el.closest("svg"); const f=byId(S.focus); if(!f) return; e.preventDefault();
  const key=el.dataset.key, kind=el.dataset.ctl; const inv=svg.getScreenCTM().inverse(); const tg=targets();
  if(kind==="tog"){ pushHist("Schalter"); const nv=num(f.params[key])>=.5?0:1; tg.forEach(p=>applyRaw(p,{[key]:nv})); afterEdit(); return; }
  pushHist("Regler"); editPushed=true;
  const keys=kind==="xy"?["X","Z"]:[key]; const start={}; tg.forEach(p=>{ start[p.id]={}; keys.forEach(k=>start[p.id][k]=normOf(p,k)); });
  drag={kind,key,keys,inv,svg,y0:e.clientY,v0:normOf(f,key),el,tg,start};
  dragMove(e);
});
function targets(){ const f=byId(S.focus); if(!f) return []; if((S.edit||"focus")==="focus") return [f]; return [f,...visiblePresets().filter(p=>p.id!==f.id)]; }
function afterEdit(){ refreshSvgs(); updateDiff(); save(); }
function applyNorms(newF){ const d=drag, f=byId(S.focus); const rel=S.edit==="rel";
  d.tg.forEach(p=>{ const o={}; d.keys.forEach(k=>{ if(newF[k]==null) return; const n=rel?d.start[p.id][k]+(newF[k]-d.start[f.id][k]):newF[k]; Object.assign(o,normToRaw({params:{...p.params,...o}},k,n)); }); applyRaw(p,o); });
  afterEdit(); }
function toSvg(e){ const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(drag.inv); return pt; }
function dragMove(e){
  if(!drag) return; const d=drag;
  if(d.kind==="knob") applyNorms({[d.key]:clamp(d.v0+(d.y0-e.clientY)/(e.shiftKey?900:160),0,1)});
  else if(d.kind==="hs"){ const x0=+d.el.dataset.x0,w=+d.el.dataset.w,pt=toSvg(e); applyNorms({[d.key]:clamp((pt.x-x0-9)/(w-18),0,1)}); }
  else if(d.kind==="vs"){ const y0=+d.el.dataset.y0,h=+d.el.dataset.h,pt=toSvg(e); applyNorms({[d.key]:clamp(1-(pt.y-y0-9)/(h-18),0,1)}); }
  else if(d.kind==="xy"){ const q=+d.el.dataset.ppm,pt=toSvg(e); applyNorms({X:clamp(.5+(pt.x-383)/q/60,0,1),Z:clamp(.5+(427-pt.y)/q/60,0,1)}); }
}
document.addEventListener("pointermove",dragMove);
